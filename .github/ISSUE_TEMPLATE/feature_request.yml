name: Feature request
description: Suggest a gateway, model-selection or workflow improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for a model or worker choice, permission mapping, or session improvement.
        Current integrations are OpenAI, Cursor, OpenCode Zen, and Antigravity.
        Claude Code executes every tool here; describe the behaviour you need from the gateway.

  - type: textarea
    id: what
    attributes:
      label: What would you like to add or change?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why? (concrete use case)
      description: What task can't you do today that this would unblock?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
